name: Build apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: powershell -ExecutionPolicy Bypass -File tool\package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  linux:
    # Oldest supported runner: the binary links against this glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libmpv-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: bash tool/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter build macos --release
      # Universal (Intel + Apple Silicon) app, unsigned, in a drag-to-Applications .dmg.
      - run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          mkdir -p dist dmg
          cp -R build/macos/Build/Products/Release/CAT.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname CAT -srcfolder dmg -ov -format UDZO "dist/catplay-v$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # Windows + Linux publish as soon as they're built; macOS runners can queue
  # for a long time, so the mac build is appended to the same release later.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  release-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
