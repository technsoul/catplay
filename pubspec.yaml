name: iptv_player
description: "CAT — fast IPTV player for desktop, Android TV and Android phones: Xtream Codes, M3U, XMLTV guide, movies & series."
publish_to: 'none'
version: 0.2.1+6

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  glass_kit: ^4.0.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  window_manager: ^0.5.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/mark.png

# `dart run msix:create` builds an installable MSIX package.
msix_config:
  display_name: CAT
  publisher_display_name: CAT
  identity_name: com.iptvplayer.desktop
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient, privateNetworkClientServer
  languages: en-us
  store: false
