name: Build apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: powershell -ExecutionPolicy Bypass -File tool\package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  linux:
    # Oldest supported runner: the binary links against this glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libmpv-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: bash tool/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      # Signed with the release key when the ANDROID_KEYSTORE_* secrets are set,
      # so updates install over older versions; otherwise with a debug key.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CAT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
        env:
          CAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/catplay-v$VERSION-android-tv-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter build macos --release
      # Universal (Intel + Apple Silicon) app, unsigned, in a drag-to-Applications .dmg.
      - run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          mkdir -p dist dmg
          cp -R build/macos/Build/Products/Release/CAT.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname CAT -srcfolder dmg -ov -format UDZO "dist/catplay-v$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # Windows + Linux publish as soon as they're built; macOS runners can queue
  # for a long time, so the mac build is appended to the same release later.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  release-macos:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
